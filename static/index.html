<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免费大模型中转服务</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px 0;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }
        
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .model-selector {
            padding: 15px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .model-selector label {
            font-weight: 600;
            color: #495057;
        }
        
        .model-selector select {
            padding: 8px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .model-selector select:hover {
            border-color: #667eea;
        }
        
        .model-selector select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .chat-messages {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .message {
            max-width: 85%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
            word-break: break-word;
        }
        
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 6px;
        }
        
        .message.assistant {
            background: #f1f3f4;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 6px;
            position: relative;
        }
        
        .message.assistant::before {
            content: '';
            position: absolute;
            top: 15px;
            left: -10px;
            width: 20px;
            height: 20px;
            background: #f1f3f4;
            border-radius: 50%;
        }
        
        .message.assistant::after {
            content: '';
            position: absolute;
            top: 15px;
            left: -5px;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
        }
        
        .message .model-tag {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding-left: 24px;
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        .input-container {
            padding: 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        
        .input-container textarea {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            border-radius: 18px;
            font-size: 15px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .input-container textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        
        .input-container button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .input-container button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        
        .input-container button:active {
            transform: translateY(0);
        }
        
        .input-container button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .api-info {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            color: white;
        }
        
        .api-info h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        .api-info pre {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        
        .api-info code {
            font-family: 'Fira Code', 'Monaco', monospace;
        }
        
        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.8rem;
            }
            
            .chat-messages {
                height: 400px;
            }
            
            .message {
                max-width: 95%;
            }
            
            .model-selector {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>免费大模型中转服务</h1>
            <p>支持豆包、文心一言、讯飞星火、Kimi、DeepSeek</p>
        </div>
        
        <div class="chat-container">
            <div class="model-selector">
                <label for="model-select">选择模型:</label>
                <select id="model-select">
                    <option value="doubao">豆包 - 字节跳动</option>
                    <option value="baidu">文心一言 - 百度</option>
                    <option value="xunfei">讯飞星火 - 科大讯飞</option>
                    <option value="kimi">Kimi - Moonshot AI</option>
                    <option value="deepseek">DeepSeek - 深度求索</option>
                </select>
            </div>
            
            <div class="chat-messages" id="chat-messages">
                <div class="message assistant">
                    <div class="model-tag">系统</div>
                    您好！我是免费大模型中转服务。请选择一个模型并开始对话。
                </div>
            </div>
            
            <div class="input-container">
                <textarea id="message-input" placeholder="输入您的问题..." rows="1"></textarea>
                <button id="send-btn">发送</button>
            </div>
        </div>
        
        <div class="api-info">
            <h3>API 使用说明</h3>
            <p><strong>POST</strong> /v1/chat/completions</p>
            <pre><code>{
  "model": "doubao",
  "messages": [{"role": "user", "content": "你好"}],
  "stream": true
}</code></pre>
            <p>支持的模型: doubao, baidu, xunfei, kimi, deepseek</p>
        </div>
    </div>
    
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        sendBtn.addEventListener('click', sendMessage);
        
        async function sendMessage() {
            const content = messageInput.value.trim();
            if (!content) return;
            
            const model = modelSelect.value;
            const modelName = modelSelect.options[modelSelect.selectedIndex].text.split(' - ')[0];
            
            addMessage('user', content);
            messageInput.value = '';
            
            const typingIndicator = addTypingIndicator();
            
            try {
                const response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: content }],
                        stream: true
                    })
                });
                
                if (!response.ok) {
                    throw new Error('请求失败');
                }
                
                chatMessages.removeChild(typingIndicator);
                const messageElement = addMessage('assistant', '', modelName);
                const reader = response.body.getReader();
                const decoder = new TextDecoder('utf-8');
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n\n');
                    
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') continue;
                            
                            try {
                                const json = JSON.parse(data);
                                const delta = json.choices?.[0]?.delta?.content || '';
                                if (delta) {
                                    messageElement.textContent += delta;
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch (e) {
                                console.error('解析错误:', e);
                            }
                        }
                    }
                }
            } catch (error) {
                chatMessages.removeChild(typingIndicator);
                addMessage('assistant', `错误: ${error.message}`, modelName);
            }
        }
        
        function addMessage(role, content, modelName = '') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            if (modelName && role === 'assistant') {
                const tag = document.createElement('div');
                tag.className = 'model-tag';
                tag.textContent = modelName;
                messageDiv.appendChild(tag);
            }
            
            const contentDiv = document.createElement('div');
            contentDiv.textContent = content;
            messageDiv.appendChild(contentDiv);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return messageDiv;
        }
        
        function addTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                indicator.appendChild(dot);
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.appendChild(indicator);
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            return messageDiv;
        }
        
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
