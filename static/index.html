<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>免费大模型中转服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; color: white; margin-bottom: 30px; padding: 20px 0; }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .header p { opacity: 0.9; font-size: 1.1rem; }
        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            padding: 12px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .toolbar label { font-weight: 600; color: #495057; font-size: 14px; }
        .toolbar select {
            padding: 8px 16px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .toolbar select:hover { border-color: #667eea; }
        .toolbar select:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2); }
        .toolbar select option.disabled { color: #aaa; }
        .btn-clear {
            margin-left: auto;
            padding: 6px 14px;
            background: #e9ecef;
            color: #495057;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-clear:hover { background: #dee2e6; }
        .status-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-mock { background: #fff3cd; color: #856404; }
        .status-available { background: #d4edda; color: #155724; }
        .status-unavailable { background: #f8d7da; color: #721c24; }
        .chat-messages {
            flex: 1;
            height: 500px;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .message.user {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.assistant {
            background: #f1f3f4;
            color: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message .meta {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .message .meta .model-name { font-weight: 600; color: #555; }
        .message .meta .source-tag {
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
        }
        .source-api { background: #d4edda; color: #155724; }
        .source-web { background: #cce5ff; color: #004085; }
        .source-mock { background: #fff3cd; color: #856404; }
        .message .content { }
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }
        .typing-indicator span {
            width: 6px; height: 6px;
            background: #667eea;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }
        .input-container {
            padding: 16px 20px;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }
        .input-container textarea {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 16px;
            font-size: 15px;
            resize: none;
            min-height: 46px;
            max-height: 150px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .input-container textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }
        .input-container button {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        .input-container button:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4); }
        .input-container button:active { transform: translateY(0); }
        .input-container button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .api-info {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            color: white;
        }
        .api-info h3 { margin-bottom: 15px; font-size: 1.2rem; }
        .api-info pre {
            background: rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .api-info code { font-family: 'Fira Code', 'Monaco', monospace; }
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .chat-messages { height: 400px; }
            .message { max-width: 95%; }
            .toolbar { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>免费大模型中转服务</h1>
            <p>支持豆包、文心一言、讯飞星火、Kimi、DeepSeek</p>
        </div>
        <div class="chat-container">
            <div class="toolbar">
                <label for="model-select">模型:</label>
                <select id="model-select"></select>
                <span id="global-status"></span>
                <button class="btn-clear" id="clear-btn">清空对话</button>
            </div>
            <div class="chat-messages" id="chat-messages">
                <div class="message assistant">
                    <div class="meta"><span class="model-name">系统</span></div>
                    <div class="content">您好！我是免费大模型中转服务。请选择一个模型并开始对话。</div>
                </div>
            </div>
            <div class="input-container">
                <textarea id="message-input" placeholder="输入您的问题..." rows="1"></textarea>
                <button id="send-btn">发送</button>
            </div>
        </div>
        <div class="api-info">
            <h3>API 使用说明</h3>
            <p><strong>POST</strong> /v1/chat/completions</p>
            <pre><code>{
  "model": "doubao",
  "messages": [{"role": "user", "content": "你好"}],
  "stream": true
}</code></pre>
            <p>支持的模型: doubao, baidu, xunfei, kimi, deepseek</p>
        </div>
    </div>
    <script>
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const clearBtn = document.getElementById('clear-btn');
        const globalStatus = document.getElementById('global-status');

        let modelsData = [];
        let sseBuffer = '';

        async function loadModels() {
            try {
                const resp = await fetch('/v1/models');
                const data = await resp.json();
                modelsData = data.data || [];
                modelSelect.innerHTML = '';
                modelsData.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id;
                    let label = m.name + ' - ' + m.description;
                    if (m.status === 'mock_only') label += ' [模拟]';
                    else if (m.status === 'unavailable') label += ' [不可用]';
                    opt.textContent = label;
                    if (m.status === 'unavailable') opt.style.color = '#aaa';
                    modelSelect.appendChild(opt);
                });
                const mockCount = modelsData.filter(m => m.status === 'mock_only').length;
                const availCount = modelsData.filter(m => m.status === 'available').length;
                if (availCount > 0) {
                    globalStatus.innerHTML = '<span class="status-badge status-available">' + availCount + '个可用</span>';
                } else if (mockCount > 0) {
                    globalStatus.innerHTML = '<span class="status-badge status-mock">模拟模式</span>';
                } else {
                    globalStatus.innerHTML = '<span class="status-badge status-unavailable">暂不可用</span>';
                }
            } catch (e) {
                modelSelect.innerHTML = '<option value="doubao">豆包</option>';
                globalStatus.innerHTML = '<span class="status-badge status-unavailable">加载失败</span>';
            }
        }

        loadModels();

        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        clearBtn.addEventListener('click', function() {
            chatMessages.innerHTML = '';
        });

        async function sendMessage() {
            var content = messageInput.value.trim();
            if (!content) return;
            if (sendBtn.disabled) return;

            var model = modelSelect.value;
            var modelInfo = modelsData.find(function(m) { return m.id === model; }) || {};
            var modelName = modelInfo.name || model;

            addMessage('user', content);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            sendBtn.disabled = true;
            var typingEl = addTypingIndicator();

            try {
                var response = await fetch('/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model,
                        messages: [{ role: 'user', content: content }],
                        stream: true
                    })
                });

                if (!response.ok) {
                    var errorMsg = '请求失败 (' + response.status + ')';
                    try {
                        var errData = await response.json();
                        if (errData.detail && errData.detail.error) {
                            errorMsg = errData.detail.error.message || errorMsg;
                            if (errData.detail.error.suggestion) {
                                errorMsg += ' - ' + errData.detail.error.suggestion;
                            }
                        }
                    } catch(e) {}
                    removeEl(typingEl);
                    addMessage('assistant', errorMsg, modelName, 'error');
                    sendBtn.disabled = false;
                    return;
                }

                removeEl(typingEl);
                var msgResult = addMessage('assistant', '', modelName, 'streaming');
                var metaEl = msgResult.metaEl;
                var contentEl = msgResult.contentEl;

                var reader = response.body.getReader();
                var decoder = new TextDecoder('utf-8');
                var fullContent = '';
                sseBuffer = '';

                while (true) {
                    var result = await reader.read();
                    if (result.done) break;

                    sseBuffer += decoder.decode(result.value, { stream: true });

                    var parts = sseBuffer.split('\n\n');
                    sseBuffer = parts.pop() || '';

                    for (var i = 0; i < parts.length; i++) {
                        var part = parts[i];
                        var lines = part.split('\n');
                        for (var j = 0; j < lines.length; j++) {
                            var line = lines[j];
                            if (line.indexOf('data: ') !== 0) continue;
                            var data = line.slice(6).trim();
                            if (data === '[DONE]') continue;

                            try {
                                var json = JSON.parse(data);
                                if (json.error) {
                                    fullContent += '\n[错误] ' + json.error.message;
                                    if (json.error.suggestion) fullContent += ' - ' + json.error.suggestion;
                                    contentEl.textContent = fullContent;
                                    break;
                                }
                                var delta = (json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content) || '';
                                if (delta) {
                                    fullContent += delta;
                                    contentEl.textContent = fullContent;
                                    chatMessages.scrollTop = chatMessages.scrollHeight;
                                }
                            } catch(e) {}
                        }
                    }
                }

                if (!fullContent) {
                    contentEl.textContent = '[空响应]';
                }

            } catch (error) {
                removeEl(typingEl);
                addMessage('assistant', '网络错误: ' + error.message, modelName, 'error');
            }

            sendBtn.disabled = false;
        }

        function addMessage(role, content, modelName, source) {
            var messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + role;

            var metaEl = document.createElement('div');
            metaEl.className = 'meta';

            if (role === 'assistant' && modelName) {
                var nameSpan = document.createElement('span');
                nameSpan.className = 'model-name';
                nameSpan.textContent = modelName;
                metaEl.appendChild(nameSpan);

                if (source && source !== 'error' && source !== 'streaming') {
                    var sourceSpan = document.createElement('span');
                    sourceSpan.className = 'source-tag source-' + source;
                    sourceSpan.textContent = source === 'api' ? 'API' : source === 'web' ? '网页' : source === 'mock' ? '模拟' : source;
                    metaEl.appendChild(sourceSpan);
                }
            }

            var contentEl = document.createElement('div');
            contentEl.className = 'content';
            contentEl.textContent = content;

            messageDiv.appendChild(metaEl);
            messageDiv.appendChild(contentEl);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return { metaEl: metaEl, contentEl: contentEl };
        }

        function addTypingIndicator() {
            var messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            var indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            for (var i = 0; i < 3; i++) {
                var dot = document.createElement('span');
                indicator.appendChild(dot);
            }
            messageDiv.appendChild(indicator);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        function removeEl(el) {
            if (el && el.parentNode) el.parentNode.removeChild(el);
        }

        messageInput.addEventListener('input', function() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 150) + 'px';
        });
    </script>
</body>
</html>
